name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for tool versions, shared with the devcontainer.
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' .devcontainer/versions.env >> "$GITHUB_ENV"

      # Download pre-built mdBook binary (~5 seconds vs 5-10 min cargo install)
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      # Cache Cargo binaries for the small preprocessors
      - name: Cache Cargo binaries
        uses: actions/cache@v4
        id: cache-cargo-binaries
        with:
          path: ~/.cargo/bin
          key: cargo-preprocessors-${{ runner.os }}-toc-${{ env.MDBOOK_TOC_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}-v2

      - name: Install mdBook preprocessors
        if: steps.cache-cargo-binaries.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install --version "${MDBOOK_TOC_VERSION}"     mdbook-toc     --locked
          cargo install --version "${MDBOOK_MERMAID_VERSION}" mdbook-mermaid --locked

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Python 3 is pre-installed on ubuntu-latest — no install needed
      - name: Convert Lean sources to Markdown
        run: |
          find FPCourse -name '*.lean' | while read f; do
            out="src/${f%.lean}.md"
            mkdir -p "$(dirname "$out")"
            python3 scripts/convert.py "$f" "$out"
          done
          # Drop checked-in output whose .lean source was renamed or deleted:
          # otherwise the orphan is still published, as a stale or blank page.
          find src/FPCourse -name '*.md' | while read md; do
            lean="${md#src/}"; lean="${lean%.md}.lean"
            [ -f "$lean" ] || { echo "Pruning orphaned $md"; rm -f "$md"; }
          done

      # Normalize Markdown to NFC (handles any Unicode edge cases)
      - name: Normalize Markdown files to NFC
        run: |
          python3 - << 'PY'
          import os, unicodedata
          for root, _, files in os.walk("src"):
              for f in files:
                  if f.endswith(".md"):
                      p = os.path.join(root, f)
                      with open(p, 'rb') as fh:
                          b = fh.read()
                      try:
                          s = b.decode('utf-8')
                      except UnicodeDecodeError:
                          continue
                      n = unicodedata.normalize('NFC', s)
                      if n != s:
                          with open(p, 'w', encoding='utf-8', newline='\n') as out:
                              out.write(n)
          PY

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The stamp preprocessor registered in book.toml substitutes the cover's
      # @GIT_COMMIT@ token during the build.  Pass the commit in explicitly:
      # the convert and NFC steps above rewrite tracked Markdown, so the
      # checkout is dirty by now and the preprocessor's own default would
      # label a clean build of a pushed commit "-dirty".
      - name: Build with mdBook
        run: BOOK_COMMIT="${GITHUB_SHA::7}" mdbook build

      # Accessibility gate: nothing is published unless the pages authored here
      # pass WCAG 2.1 AA and Section 508.  mdBook's own pages are reported but
      # do not block -- their violations come from the upstream theme (ARIA on
      # the sidebar toggle, unlabelled task-list checkboxes, scrollable code
      # regions) and cannot be fixed from this repository.
      #
      # Calls the script rather than `make a11y`, because that target depends on
      # `build` and a rebuild here would run mdbook without BOOK_COMMIT,
      # re-stamping the cover with the wrong value.
      - name: Check accessibility
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/a11y_check.py book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
